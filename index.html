<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BR 2D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0f14;
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

/* ============ SETUP ============ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ============ CONST ============ */
const WORLD = 3200;
const ZONE_START_R = 1500;
const ZONE_END_R = 120;
const ZONE_SHRINK = 22;      // px/sec
const ZONE_DPS = 7;          // damage/sec outside
const BOTS_COUNT = 29;
const JOY_R = 80;
const PLAYER_SPEED = 190;

const WEAPONS = {
  pistol:  { name:'PISTOL',  dmg:12, rate:0.28, spread:0.06, speed:750,  ammo:12, reload:1.1, color:'#ffd166', pellets:1 },
  smg:     { name:'SMG',     dmg:9,  rate:0.09, spread:0.11, speed:820,  ammo:30, reload:1.4, color:'#06d6a0', pellets:1 },
  shotgun: { name:'SHOTGUN', dmg:8,  rate:0.85, spread:0.30, speed:650,  ammo:6,  reload:1.8, color:'#ef476f', pellets:6 },
  rifle:   { name:'RIFLE',   dmg:24, rate:0.5,  spread:0.02, speed:1050, ammo:15, reload:1.6, color:'#4cc9f0', pellets:1 },
};
const WEAPON_KEYS = Object.keys(WEAPONS);

/* ============ STATE ============ */
let player, bots, bullets, loot, particles, killFeed, zone;
let cam = { x:0, y:0 };
let gameState = 'playing'; // playing | won | lost
let time = 0;
let aliveCount = BOTS_COUNT + 1;

const rand = (a,b) => a + Math.random()*(b-a);

/* ============ ENTITIES ============ */
function makeEntity(x, y, isBot, name){
  return {
    x, y, r:16, hp:100, maxHp:100, angle:0,
    isBot, name,
    speed: PLAYER_SPEED,
    weapon: WEAPONS.pistol,
    weaponKey: 'pistol',
    ammo: WEAPONS.pistol.ammo,
    reloading: 0,
    fireCd: 0,
    alive: true,
    kills: 0,
    wanderAngle: rand(0, Math.PI*2),
    wanderTimer: 0,
  };
}

function resetGame(){
  player = makeEntity(WORLD/2, WORLD/2, false, 'YOU');
  bots = [];
  for (let i = 0; i < BOTS_COUNT; i++){
    const b = makeEntity(rand(220, WORLD-220), rand(220, WORLD-220), true, 'Bot'+Math.floor(rand(10,999)));
    b.speed = rand(140, 175);
    const wk = WEAPON_KEYS[Math.floor(Math.random()*WEAPON_KEYS.length)];
    b.weapon = WEAPONS[wk]; b.weaponKey = wk; b.ammo = b.weapon.ammo;
    bots.push(b);
  }
  bullets = [];
  loot = [];
  particles = [];
  killFeed = [];
  for (let i = 0; i < 55; i++) spawnLoot();
  zone = { x: WORLD/2, y: WORLD/2, r: ZONE_START_R, targetR: ZONE_END_R };
  time = 0;
  gameState = 'playing';
  aliveCount = BOTS_COUNT + 1;
}

function spawnLoot(){
  const r = Math.random();
  if (r < 0.22){
    loot.push({ x: rand(120, WORLD-120), y: rand(120, WORLD-120), type:'health', r:12 });
  } else {
    const wk = WEAPON_KEYS[Math.floor(Math.random()*WEAPON_KEYS.length)];
    loot.push({ x: rand(120, WORLD-120), y: rand(120, WORLD-120), type:'weapon', weaponKey: wk, r:14 });
  }
}

function killEntity(ent, killer){
  if (!ent.alive) return;
  ent.alive = false;
  if (killer && killer !== ent) killer.kills++;
  // drop loot
  loot.push({ x: ent.x, y: ent.y, type:'weapon', weaponKey: ent.weaponKey, r:14 });
  if (Math.random() < 0.6) loot.push({ x: ent.x + rand(-28,28), y: ent.y + rand(-28,28), type:'health', r:12 });
  // feed
  const kname = killer ? killer.name : 'ZONE';
  killFeed.push({ text: `${kname} → ${ent.name}`, t: 4 });
  if (killFeed.length > 4) killFeed.shift();
  // particles
  for (let i = 0; i < 12; i++){
    particles.push({ x:ent.x, y:ent.y, vx: rand(-120,120), vy: rand(-120,120), life: 0.6, color:'#ff5a5a' });
  }
}

/* ============ INPUT ============ */
const joyL = { active:false, id:null, ox:0, oy:0, x:0, y:0 };
const joyR = { active:false, id:null, ox:0, oy:0, x:0, y:0 };
const keys = {};
const mouse = { x:0, y:0, down:false };

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameState !== 'playing'){ resetGame(); return; }
  for (const t of e.changedTouches){
    if (t.clientX < W/2 && joyL.id === null){
      joyL.id = t.identifier; joyL.ox = t.clientX; joyL.oy = t.clientY;
      joyL.x = t.clientX; joyL.y = t.clientY; joyL.active = true;
    } else if (t.clientX >= W/2 && joyR.id === null){
      joyR.id = t.identifier; joyR.ox = t.clientX; joyR.oy = t.clientY;
      joyR.x = t.clientX; joyR.y = t.clientY; joyR.active = true;
    }
  }
}, { passive:false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches){
    if (t.identifier === joyL.id){ joyL.x = t.clientX; joyL.y = t.clientY; }
    if (t.identifier === joyR.id){ joyR.x = t.clientX; joyR.y = t.clientY; }
  }
}, { passive:false });

function endTouch(e){
  for (const t of e.changedTouches){
    if (t.identifier === joyL.id){ joyL.active=false; joyL.id=null; }
    if (t.identifier === joyR.id){ joyR.active=false; joyR.id=null; }
  }
}
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);

// Desktop test
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', () => { if (gameState !== 'playing') resetGame(); else mouse.down = true; });
canvas.addEventListener('mouseup',   () => { mouse.down = false; });

/* ============ COMBAT ============ */
function tryFire(ent, dt){
  if (ent.fireCd > 0 || ent.reloading > 0) return;
  if (ent.ammo <= 0){ ent.reloading = ent.weapon.reload; return; }
  const w = ent.weapon;
  const p = w.pellets || 1;
  for (let i = 0; i < p; i++){
    const a = ent.angle + rand(-w.spread, w.spread);
    bullets.push({
      x: ent.x + Math.cos(ent.angle)*(ent.r + 6),
      y: ent.y + Math.sin(ent.angle)*(ent.r + 6),
      vx: Math.cos(a)*w.speed,
      vy: Math.sin(a)*w.speed,
      dmg: w.dmg, owner: ent, life: 1.2, color: w.color,
    });
  }
  ent.ammo--;
  ent.fireCd = w.rate;
  // muzzle particles
  for (let i = 0; i < 3; i++){
    particles.push({
      x: ent.x + Math.cos(ent.angle)*(ent.r+10),
      y: ent.y + Math.sin(ent.angle)*(ent.r+10),
      vx: Math.cos(ent.angle)*rand(50,150) + rand(-40,40),
      vy: Math.sin(ent.angle)*rand(50,150) + rand(-40,40),
      life: 0.15, color: w.color
    });
  }
}

/* ============ UPDATE ============ */
function updatePlayer(dt){
  if (!player.alive) return;
  // move
  let dx = 0, dy = 0;
  if (joyL.active){
    const jx = joyL.x - joyL.ox, jy = joyL.y - joyL.oy;
    const d = Math.hypot(jx, jy);
    if (d > 8){
      const k = Math.min(1, d / JOY_R);
      dx = jx/d * k; dy = jy/d * k;
    }
  }
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  const m = Math.hypot(dx, dy);
  if (m > 1){ dx /= m; dy /= m; }
  player.x += dx * player.speed * dt;
  player.y += dy * player.speed * dt;
  player.x = Math.max(player.r, Math.min(WORLD - player.r, player.x));
  player.y = Math.max(player.r, Math.min(WORLD - player.r, player.y));

  // aim + fire
  let wantFire = false;
  if (joyR.active){
    const jx = joyR.x - joyR.ox, jy = joyR.y - joyR.oy;
    const d = Math.hypot(jx, jy);
    if (d > 15){
      player.angle = Math.atan2(jy, jx);
      wantFire = true;
    }
  }
  if (mouse.down){
    const psx = player.x - cam.x, psy = player.y - cam.y;
    player.angle = Math.atan2(mouse.y - psy, mouse.x - psx);
    wantFire = true;
  }
  if (wantFire) tryFire(player, dt);

  if (player.fireCd > 0) player.fireCd -= dt;
  if (player.reloading > 0){
    player.reloading -= dt;
    if (player.reloading <= 0) player.ammo = player.weapon.ammo;
  }
}

function updateBot(b, dt){
  if (!b.alive) return;
  // find target
  let target = null, minD = 700;
  if (player.alive){
    const d = Math.hypot(player.x - b.x, player.y - b.y);
    if (d < minD){ minD = d; target = player; }
  }
  for (const o of bots){
    if (o === b || !o.alive) continue;
    const d = Math.hypot(o.x - b.x, o.y - b.y);
    if (d < minD){ minD = d; target = o; }
  }

  // zone awareness
  const zdx = zone.x - b.x, zdy = zone.y - b.y;
  const zdist = Math.hypot(zdx, zdy);
  const outside = zdist > zone.r - 150;

  let mx = 0, my = 0;
  if (target && minD < 500 && !outside){
    const ang = Math.atan2(target.y - b.y, target.x - b.x);
    b.angle = ang;
    if (minD > 220){
      mx = Math.cos(ang); my = Math.sin(ang);
    } else if (minD < 130){
      mx = -Math.cos(ang); my = -Math.sin(ang);
    } else {
      const s = Math.sin(time*2 + b.wanderAngle);
      mx = Math.cos(ang + Math.PI/2) * s;
      my = Math.sin(ang + Math.PI/2) * s;
    }
    tryFire(b, dt);
  } else if (outside){
    b.angle = Math.atan2(zdy, zdx);
    mx = zdx/zdist; my = zdy/zdist;
    if (zdist < zone.r * 0.5 && Math.random() < 0.005){
      // look around
    }
  } else {
    b.wanderTimer -= dt;
    if (b.wanderTimer <= 0){
      b.wanderAngle = rand(0, Math.PI*2);
      b.wanderTimer = rand(1.2, 3.5);
    }
    b.angle = b.wanderAngle;
    mx = Math.cos(b.wanderAngle) * 0.7;
    my = Math.sin(b.wanderAngle) * 0.7;
  }

  const m = Math.hypot(mx, my);
  if (m > 1){ mx /= m; my /= m; }
  b.x += mx * b.speed * dt;
  b.y += my * b.speed * dt;
  b.x = Math.max(b.r, Math.min(WORLD - b.r, b.x));
  b.y = Math.max(b.r, Math.min(WORLD - b.r, b.y));

  if (b.fireCd > 0) b.fireCd -= dt;
  if (b.reloading > 0){
    b.reloading -= dt;
    if (b.reloading <= 0) b.ammo = b.weapon.ammo;
  }
}

function updateBullets(dt){
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0 || b.x < 0 || b.x > WORLD || b.y < 0 || b.y > WORLD){
      bullets.splice(i, 1); continue;
    }
    // hit check
    let hit = false;
    const all = [player, ...bots];
    for (const t of all){
      if (!t.alive || t === b.owner) continue;
      if (Math.hypot(t.x - b.x, t.y - b.y) < t.r + 4){
        t.hp -= b.dmg;
        for (let k = 0; k < 4; k++){
          particles.push({
            x: b.x, y: b.y,
            vx: rand(-100,100), vy: rand(-100,100),
            life: 0.3, color: '#ffd166'
          });
        }
        if (t.hp <= 0) killEntity(t, b.owner);
        hit = true;
        break;
      }
    }
    if (hit) bullets.splice(i, 1);
  }
}

function updateLoot(){
  if (!player.alive) return;
  for (let i = loot.length - 1; i >= 0; i--){
    const l = loot[i];
    if (Math.hypot(player.x - l.x, player.y - l.y) < player.r + l.r + 6){
      if (l.type === 'health'){
        if (player.hp >= player.maxHp) continue;
        player.hp = Math.min(player.maxHp, player.hp + 40);
        loot.splice(i, 1);
      } else {
        if (player.weaponKey === l.weaponKey) continue;
        player.weapon = WEAPONS[l.weaponKey];
        player.weaponKey = l.weaponKey;
        player.ammo = player.weapon.ammo;
        player.reloading = 0;
        loot.splice(i, 1);
      }
    }
  }
}

function updateZone(dt){
  zone.r = Math.max(ZONE_END_R, zone.r - ZONE_SHRINK * dt);

  // damage outside
  if (player.alive){
    const d = Math.hypot(player.x - zone.x, player.y - zone.y);
    if (d > zone.r){
      player.hp -= ZONE_DPS * dt;
      if (player.hp <= 0) killEntity(player, null);
    }
  }
  for (const b of bots){
    if (!b.alive) continue;
    const d = Math.hypot(b.x - zone.x, b.y - zone.y);
    if (d > zone.r){
      b.hp -= ZONE_DPS * dt;
      if (b.hp <= 0) killEntity(b, null);
    }
  }
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = killFeed.length - 1; i >= 0; i--){
    killFeed[i].t -= dt;
    if (killFeed[i].t <= 0) killFeed.splice(i, 1);
  }
}

function checkWin(){
  aliveCount = (player.alive ? 1 : 0) + bots.filter(b => b.alive).length;
  if (gameState !== 'playing') return;
  if (!player.alive) gameState = 'lost';
  else if (aliveCount === 1) gameState = 'won';
}

/* ============ CAMERA ============ */
function updateCamera(){
  const focus = player.alive ? player : { x: zone.x, y: zone.y };
  cam.x = focus.x - W/2;
  cam.y = focus.y - H/2;
  if (W < WORLD) cam.x = Math.max(0, Math.min(WORLD - W, cam.x));
  if (H < WORLD) cam.y = Math.max(0, Math.min(WORLD - H, cam.y));
}

/* ============ RENDER ============ */
function drawGrid(){
  const step = 100;
  const x0 = Math.floor(cam.x / step) * step;
  const y0 = Math.floor(cam.y / step) * step;
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = x0; x < cam.x + W + step; x += step){
    ctx.moveTo(x - cam.x, 0);
    ctx.lineTo(x - cam.x, H);
  }
  for (let y = y0; y < cam.y + H + step; y += step){
    ctx.moveTo(0, y - cam.y);
    ctx.lineTo(W, y - cam.y);
  }
  ctx.stroke();
  // world border
  ctx.strokeStyle = 'rgba(255,80,80,0.5)';
  ctx.lineWidth = 4;
  ctx.strokeRect(-cam.x, -cam.y, WORLD, WORLD);
}

function drawZone(){
  const sx = zone.x - cam.x, sy = zone.y - cam.y;
  ctx.save();
  ctx.beginPath();
  ctx.rect(-100, -100, W + 200, H + 200);
  ctx.arc(sx, sy, zone.r, 0, Math.PI*2, true);
  ctx.fillStyle = 'rgba(120,20,30,0.28)';
  ctx.fill();
  ctx.restore();

  ctx.beginPath();
  ctx.arc(sx, sy, zone.r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,80,120,0.85)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function drawLoot(){
  for (const l of loot){
    const sx = l.x - cam.x, sy = l.y - cam.y;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
    ctx.save();
    ctx.translate(sx, sy);
    if (l.type === 'health'){
      ctx.fillStyle = '#06d6a0';
      ctx.beginPath();
      ctx.arc(0, 0, l.r, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(-6, -2, 12, 4);
      ctx.fillRect(-2, -6, 4, 12);
    } else {
      ctx.fillStyle = WEAPONS[l.weaponKey].color;
      ctx.fillRect(-12, -6, 24, 12);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(-4, -6, 8, 12);
    }
    ctx.restore();
  }
}

function drawEntity(ent){
  if (!ent.alive) return;
  const sx = ent.x - cam.x, sy = ent.y - cam.y;
  if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) return;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(ent.angle);
  // body
  ctx.beginPath();
  ctx.arc(0, 0, ent.r, 0, Math.PI*2);
  ctx.fillStyle = ent.isBot ? '#e63946' : '#4895ef';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#0a0f14';
  ctx.stroke();
  // gun
  ctx.fillStyle = '#111';
  ctx.fillRect(ent.r - 4, -3, 20, 6);
  ctx.fillStyle = ent.weapon.color;
  ctx.fillRect(ent.r + 10, -2, 4, 4);
  ctx.restore();

  // hp bar
  if (ent.hp < ent.maxHp){
    const bw = 34;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(sx - bw/2, sy - ent.r - 13, bw, 5);
    const ratio = Math.max(0, ent.hp / ent.maxHp);
    ctx.fillStyle = ratio > 0.5 ? '#06d6a0' : ratio > 0.25 ? '#ffd166' : '#ef476f';
    ctx.fillRect(sx - bw/2, sy - ent.r - 13, bw * ratio, 5);
  }
  // name for bots (small)
  if (ent.isBot){
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ent.name, sx, sy - ent.r - 18);
  }
}

function drawBullets(){
  for (const b of bullets){
    const sx = b.x - cam.x, sy = b.y - cam.y;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    ctx.beginPath();
    ctx.arc(sx, sy, 3, 0, Math.PI*2);
    ctx.fillStyle = b.color;
    ctx.fill();
    // trail
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - b.vx * 0.012, sy - b.vy * 0.012);
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawParticles(){
  for (const p of particles){
    const sx = p.x - cam.x, sy = p.y - cam.y;
    if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(sx - 2, sy - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function drawJoystick(joy){
  if (!joy.active) return;
  ctx.beginPath();
  ctx.arc(joy.ox, joy.oy, JOY_R, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fill();

  let dx = joy.x - joy.ox, dy = joy.y - joy.oy;
  const d = Math.hypot(dx, dy);
  if (d > JOY_R){ dx = dx/d*JOY_R; dy = dy/d*JOY_R; }

  ctx.beginPath();
  ctx.arc(joy.ox + dx, joy.oy + dy, 30, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();
}

function drawHUD(){
  // HP bar
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(16, 16, 200, 26);
  const hp = Math.max(0, player.hp) / player.maxHp;
  ctx.fillStyle = hp > 0.5 ? '#06d6a0' : hp > 0.25 ? '#ffd166' : '#ef476f';
  ctx.fillRect(18, 18, 196 * hp, 22);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('HP ' + Math.max(0, Math.round(player.hp)), 24, 34);

  // Alive
  ctx.textAlign = 'center';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('ALIVE: ' + aliveCount, W/2, 36);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText('KILLS: ' + player.kills, W/2, 54);

  // Weapon + ammo (bottom-right)
  ctx.textAlign = 'right';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = player.weapon.color;
  ctx.fillText(player.weapon.name, W - 20, H - 60);
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = '#fff';
  if (player.reloading > 0) ctx.fillText('RELOAD...', W - 20, H - 32);
  else ctx.fillText(player.ammo + ' / ' + player.weapon.ammo, W - 20, H - 32);

  // Kill feed (top-right)
  ctx.textAlign = 'right';
  ctx.font = '12px sans-serif';
  killFeed.forEach((k, i) => {
    ctx.globalAlpha = Math.min(1, k.t);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText(k.text, W - 16, 100 + i * 18);
  });
  ctx.globalAlpha = 1;

  // Minimap (top-right corner, small)
  const mm = 90, mx = W - mm - 16, my = 16;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(mx, my, mm, mm);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.strokeRect(mx, my, mm, mm);
  const kx = mm / WORLD;
  // zone
  ctx.beginPath();
  ctx.arc(mx + zone.x*kx, my + zone.y*kx, zone.r*kx, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,80,120,0.8)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // bots
  for (const b of bots){
    if (!b.alive) continue;
    ctx.fillStyle = '#e63946';
    ctx.fillRect(mx + b.x*kx - 1, my + b.y*kx - 1, 3, 3);
  }
  // player
  if (player.alive){
    ctx.fillStyle = '#4895ef';
    ctx.fillRect(mx + player.x*kx - 2, my + player.y*kx - 2, 5, 5);
  }

  // Auto-joystick hint
  if (!joyL.active && !joyR.active && gameState === 'playing' && time < 4){
    ctx.globalAlpha = 0.5 - time * 0.1;
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('ЛЕВЫЙ ПАЛЕЦ — ДВИЖЕНИЕ', W/2, H - 140);
    ctx.fillText('ПРАВЫЙ ПАЛЕЦ — ПРИЦЕЛ И ОГОНЬ', W/2, H - 120);
    ctx.globalAlpha = 1;
  }
}

function drawEndScreen(){
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  if (gameState === 'won'){
    ctx.fillStyle = '#06d6a0';
    ctx.font = 'bold 48px sans-serif';
    ctx.fillText('ПОБЕДА!', W/2, H/2 - 30);
  } else {
    ctx.fillStyle = '#ef476f';
    ctx.font = 'bold 48px sans-serif';
    ctx.fillText('ПОРАЖЕНИЕ', W/2, H/2 - 30);
  }
  ctx.fillStyle = '#fff';
  ctx.font = '18px sans-serif';
  ctx.fillText('Убийств: ' + player.kills, W/2, H/2 + 20);
  ctx.fillText('Место: #' + aliveCount, W/2, H/2 + 46);
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#4cc9f0';
  ctx.fillText('ТАПНИ, ЧТОБЫ ИГРАТЬ СНОВА', W/2, H/2 + 100);
}

/* ============ MAIN LOOP ============ */
let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;

  if (gameState === 'playing'){
    time += dt;
    updatePlayer(dt);
    for (const b of bots) updateBot(b, dt);
    updateBullets(dt);
    updateLoot();
    updateZone(dt);
    updateParticles(dt);
    checkWin();
  } else {
    updateParticles(dt);
  }
  updateCamera();

  // Render
  ctx.fillStyle = '#0d141c';
  ctx.fillRect(0, 0, W, H);
  drawGrid();
  drawZone();
  drawLoot();
  for (const b of bots) drawEntity(b);
  drawEntity(player);
  drawBullets();
  drawParticles();

  if (gameState === 'playing'){
    drawJoystick(joyL);
    drawJoystick(joyR);
    drawHUD();
  } else {
    drawEndScreen();
  }

  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);

})();
</script>
